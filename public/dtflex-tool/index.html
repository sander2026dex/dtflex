    <script>
      // Proteção anti-print dentro do iframe da ferramenta
      (function () {
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('keydown', function (e) {
          var k = e.key;
          if (k === 'PrintScreen') {
            try { navigator.clipboard.writeText(''); } catch (_) {}
            e.preventDefault();
            alert('Captura de tela bloqueada nesta ferramenta.');
            return;
          }
          if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 'P' || k === 's' || k === 'S')) {
            e.preventDefault();
            return;
          }
          if (k === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','I','j','J','c','C'].indexOf(k) !== -1)) {
            e.preventDefault();
          }
        }, true);
        window.addEventListener('beforeprint', function () { document.body.style.visibility = 'hidden'; });
        window.addEventListener('afterprint', function () { document.body.style.visibility = ''; });
      })();
    </script>
    <script>
      // ====== Patch PNG export: final file is always verified at real 300 DPI (pHYs) ======
      (function () {
        var DPI = 300;
        var PPM_300 = 11811;
        var A4_WIDTH = 2480;
        var A4_HEIGHT = 3508;
        var A3_WIDTH = 3508;
        var A3_HEIGHT = 4961;
        var PNG_SIG = new Uint8Array([137,80,78,71,13,10,26,10]);

        try {
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (reg) { reg.unregister(); }); });
          if ('caches' in window) caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); });
        } catch (_) {}

        var CRC_TABLE = (function(){
          var t = new Uint32Array(256);
          for (var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
          return t;
        })();
        function crc32(b){var c=0xffffffff;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xff]^(c>>>8);return (c^0xffffffff)>>>0;}
        function isPng(buf){ if (!buf || buf.length < 33) return false; for (var i=0;i<8;i++) if (buf[i]!==PNG_SIG[i]) return false; return true; }
        function chunkType(buf, off){ return String.fromCharCode(buf[off+4],buf[off+5],buf[off+6],buf[off+7]); }
        function concat(parts){ var total=0; for (var i=0;i<parts.length;i++) total+=parts[i].length; var out=new Uint8Array(total), cur=0; for (var j=0;j<parts.length;j++){ out.set(parts[j], cur); cur+=parts[j].length; } return out; }
        function buildPhys(){
          var data = new Uint8Array(9);
          var dv = new DataView(data.buffer);
          dv.setUint32(0, PPM_300, false);
          dv.setUint32(4, PPM_300, false);
          data[8]=1;
          var type = new Uint8Array([0x70,0x48,0x59,0x73]);
          var body = new Uint8Array(4+9);
          body.set(type,0); body.set(data,4);
          var out = new Uint8Array(4+4+9+4);
          var od = new DataView(out.buffer);
          od.setUint32(0,9,false);
          out.set(type,4); out.set(data,8);
          od.setUint32(17, crc32(body), false);
          return out;
        }
        function readPhys(buf){
          if (!isPng(buf)) return null;
          var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
          var off=8;
          while (off + 12 <= buf.length){
            var len = dv.getUint32(off,false);
            var end = off+8+len+4;
            if (end > buf.length) return null;
            var t = chunkType(buf, off);
            if (t==='pHYs' && len===9) {
              return { x: dv.getUint32(off+8,false), y: dv.getUint32(off+12,false), unit: buf[off+16] };
            }
            if (t==='IEND') break;
            off=end;
          }
          return null;
        }
        function setDpi(buf){
          if (!isPng(buf)) return buf;
          var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
          var parts = [buf.subarray(0,8)];
          var phys = buildPhys();
          var inserted = false;
          var off=8;
          while (off + 12 <= buf.length){
            var len = dv.getUint32(off,false);
            var end = off+8+len+4;
            if (end > buf.length) return buf;
            var t = chunkType(buf, off);
            if (t !== 'pHYs') parts.push(buf.subarray(off,end));
            if (t === 'IHDR' && !inserted) { parts.push(phys); inserted = true; }
            off=end;
            if (t==='IEND') break;
          }
          if (!inserted) parts.splice(1,0,phys);
          return concat(parts);
        }
        function ensureDpi(buf){
          var fixed = setDpi(buf);
          var meta = readPhys(fixed);
          if (!meta || meta.x !== PPM_300 || meta.y !== PPM_300 || meta.unit !== 1) fixed = setDpi(fixed);
          meta = readPhys(fixed);
          window.__DTF_LAST_DPI_CHECK = meta;
          try { console.log('[DPI300] verificado pHYs=', meta && meta.x, meta && meta.y, 'unit=', meta && meta.unit); } catch(_){}
          return fixed;
        }
        function bytesToBase64(bytes){
          var binary = '';
          var chunk = 0x8000;
          for (var i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
          return btoa(binary);
        }
        function dataUrlToBytes(url){
          var comma = url.indexOf(',');
          var bin = atob(url.substring(comma+1));
          var buf = new Uint8Array(bin.length);
          for (var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
          return buf;
        }
        function fixDataUrl(url){
          if (typeof url !== 'string' || url.indexOf('data:image/png') !== 0) return url;
          try { return 'data:image/png;base64,' + bytesToBase64(ensureDpi(dataUrlToBytes(url))); }
          catch(e){ console.warn('[DPI300] falha ao regravar data URL', e); return url; }
        }
        // Bounding box dos pixels não-transparentes do canvas de origem
        function getContentBBox(source){
          try {
            var sctx = source.getContext && source.getContext('2d');
            if (!sctx) return null;
            var W = source.width, H = source.height;
            var img = sctx.getImageData(0, 0, W, H).data;
            var minX = W, minY = H, maxX = -1, maxY = -1;
            for (var y = 0; y < H; y++) {
              for (var x = 0; x < W; x++) {
                if (img[(y * W + x) * 4 + 3] > 4) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }
            if (maxX < 0) return null;
            return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
          } catch (e) { return null; }
        }
        // Configuração de margem de segurança (acessível via UI)
        window.__DTF_EXPORT_MARGIN = window.__DTF_EXPORT_MARGIN || { mode: 'auto', value: 8 };
        function computePaddingPx(bbox){
          var cfg = window.__DTF_EXPORT_MARGIN || { mode: 'auto', value: 8 };
          var base = Math.max(bbox.w, bbox.h);
          if (cfg.mode === 'mm') {
            // 300 DPI → 1 mm = 300/25.4 px
            return Math.round((Number(cfg.value) || 0) * 300 / 25.4);
          }
          if (cfg.mode === 'percent') {
            return Math.round(base * (Number(cfg.value) || 0) / 100);
          }
          // auto: 8% do maior lado da arte
          return Math.round(base * 0.08);
        }
        function makeSizedCanvas(source, maxW, maxH){
          var out = document.createElement('canvas');
          var ctx = out.getContext('2d', { alpha: true });
          if (!ctx) return source;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          out.width = maxW;
          out.height = maxH;
          ctx.clearRect(0, 0, maxW, maxH);

          // 1) Bounding box: usa recorte manual se definido; senão detecta automaticamente
          var bbox = null;
          if (window.__DTF_MANUAL_BBOX) {
            var m = window.__DTF_MANUAL_BBOX;
            bbox = { x: Math.max(0, m.x|0), y: Math.max(0, m.y|0),
                     w: Math.min(source.width - (m.x|0), m.w|0),
                     h: Math.min(source.height - (m.y|0), m.h|0) };
            window.__DTF_MANUAL_BBOX = null;
          }
          if (!bbox || bbox.w <= 0 || bbox.h <= 0) bbox = getContentBBox(source);
          if (!bbox) bbox = { x: 0, y: 0, w: source.width, h: source.height };

          // 2) Adicionar margem de segurança ao redor (0 quando o recorte foi manual)
          var pad = window.__DTF_SKIP_PADDING ? 0 : computePaddingPx(bbox);
          window.__DTF_SKIP_PADDING = false;
          var paddedW = bbox.w + pad * 2;
          var paddedH = bbox.h + pad * 2;

          // 3) Ajustar à folha mantendo proporção (só reduz se exceder)
          var scale = 1;
          if (paddedW > maxW || paddedH > maxH) {
            scale = Math.min(maxW / paddedW, maxH / paddedH);
          }
          var drawW = Math.round(bbox.w * scale);
          var drawH = Math.round(bbox.h * scale);
          var totalW = Math.round(paddedW * scale);
          var totalH = Math.round(paddedH * scale);

          // 4) Centralizar na folha
          var offX = Math.round((maxW - totalW) / 2 + pad * scale);
          var offY = Math.round((maxH - totalH) / 2 + pad * scale);

          ctx.drawImage(source, bbox.x, bbox.y, bbox.w, bbox.h, offX, offY, drawW, drawH);
          return out;
        }
        function makeA4Canvas(source){ return makeSizedCanvas(source, A4_WIDTH, A4_HEIGHT); }
        function makeA3Canvas(source){ return makeSizedCanvas(source, A3_WIDTH, A3_HEIGHT); }

        function normalizeDownloadName(name){
          var finalName = name || 'DTFlexPro_300dpi.png';
          var tag = null;
          if (window.__DTF_PENDING_A4_DOWNLOAD) { tag = '_A4'; window.__DTF_PENDING_A4_DOWNLOAD = false; }
          else if (window.__DTF_PENDING_A3_DOWNLOAD) { tag = '_A3'; window.__DTF_PENDING_A3_DOWNLOAD = false; }
          if (tag) {
            finalName = finalName.replace(/\.png$/i, '');
            if (finalName.indexOf(tag) === -1) finalName += tag;
            if (finalName.indexOf('300dpi') === -1) finalName += '_300dpi';
            finalName += '.png';
          }
          return finalName;
        }
        function fixAnchorSync(a){
          a.href = fixDataUrl(a.href);
          a.download = normalizeDownloadName(a.download);
          a.setAttribute('data-dpi-fixed', 'true');
        }
        var origAnchorClick = HTMLAnchorElement.prototype.click;
        async function forceFixedPngDownload(a){
          try {
            var res = await fetch(a.href, { cache: 'no-store' });
            var fixed = ensureDpi(new Uint8Array(await res.arrayBuffer()));
            var url = URL.createObjectURL(new Blob([fixed], { type: 'image/png' }));
            var dl = document.createElement('a');
            dl.href = url;
            dl.download = normalizeDownloadName(a.download);
            dl.setAttribute('data-dpi-fixed', 'true');
            document.body.appendChild(dl);
            origAnchorClick.call(dl);
            setTimeout(function(){ URL.revokeObjectURL(url); dl.remove(); }, 1500);
          } catch(e) {
            fixAnchorSync(a);
            origAnchorClick.call(a);
          }
        }
        async function rewriteBlob(blob){
          try {
            if (!blob || blob.type !== 'image/png') return blob;
            return new Blob([ensureDpi(new Uint8Array(await blob.arrayBuffer()))], { type: 'image/png' });
          } catch(e){ return blob; }
        }

        var origToBlob = HTMLCanvasElement.prototype.toBlob;
        HTMLCanvasElement.prototype.toBlob = function(cb, type, q){
          var source = this;
          if ((!type || type === 'image/png') && window.__flat && source === window.__flat) {
            if (window.__DTF_EXPORT_A4_NEXT) {
              source = makeA4Canvas(source);
              window.__DTF_EXPORT_A4_NEXT = false;
              window.__DTF_PENDING_A4_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A3_NEXT) {
              source = makeA3Canvas(source);
              window.__DTF_EXPORT_A3_NEXT = false;
              window.__DTF_PENDING_A3_DOWNLOAD = true;
            }
          }
          return origToBlob.call(source, function(b){
            if (b && (type==='image/png' || !type)) rewriteBlob(b).then(cb); else cb(b);
          }, type, q);
        };

        var origToDataURL = HTMLCanvasElement.prototype.toDataURL;
        HTMLCanvasElement.prototype.toDataURL = function(type){
          var source = this;
          if ((!type || type === 'image/png') && window.__flat && source === window.__flat) {
            if (window.__DTF_EXPORT_A4_NEXT) {
              source = makeA4Canvas(source);
              window.__DTF_EXPORT_A4_NEXT = false;
              window.__DTF_PENDING_A4_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A3_NEXT) {
              source = makeA3Canvas(source);
              window.__DTF_EXPORT_A3_NEXT = false;
              window.__DTF_PENDING_A3_DOWNLOAD = true;
            }
          }
          var url = origToDataURL.apply(source, arguments);
          if (type && type !== 'image/png') return url;
          return fixDataUrl(url);
        };

        HTMLAnchorElement.prototype.click = function(){
          if (this.download && this.getAttribute('data-dpi-fixed') !== 'true' && typeof this.href === 'string') {
            if (this.href.indexOf('data:image/png') === 0) {
              fixAnchorSync(this);
              return origAnchorClick.apply(this, arguments);
            }
            if (this.href.indexOf('blob:') === 0) {
              forceFixedPngDownload(this);
              return;
            }
          }
          return origAnchorClick.apply(this, arguments);
        };
        document.addEventListener('click', function(e){
          var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
          if (a && a.getAttribute('data-dpi-fixed') !== 'true' && typeof a.href === 'string') {
            if (a.href.indexOf('data:image/png') === 0) { fixAnchorSync(a); return; }
            if (a.href.indexOf('blob:') === 0) { e.preventDefault(); e.stopImmediatePropagation(); forceFixedPngDownload(a); }
          }
        }, true);

        function installSizeButtons(){
          var buttons = Array.prototype.slice.call(document.querySelectorAll('button'));
          var master = buttons.find(function(btn){ return /Exportar Master/i.test(btn.textContent || ''); });
          if (!master || !master.parentElement) return;
          master.style.display = 'none';

          // Seletor de margem de recorte
          if (!document.getElementById('dtf-margin-wrap')) {
            var wrap = document.createElement('div');
            wrap.id = 'dtf-margin-wrap';
            wrap.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:12px;color:inherit;';
            wrap.innerHTML = ''
              + '<label style="font-weight:600;">Margem de recorte:</label>'
              + '<select id="dtf-margin-mode" style="padding:4px 6px;border-radius:6px;border:1px solid #555;background:transparent;color:inherit;">'
              + '  <option value="auto">Automática (8%)</option>'
              + '  <option value="percent">Porcentagem (%)</option>'
              + '  <option value="mm">Milímetros (mm)</option>'
              + '</select>'
              + '<input id="dtf-margin-value" type="number" min="0" step="1" value="8" style="width:70px;padding:4px 6px;border-radius:6px;border:1px solid #555;background:transparent;color:inherit;display:none;" />'
              + '<span id="dtf-margin-unit" style="opacity:.7;display:none;">%</span>';
            master.parentElement.insertBefore(wrap, master);
            var modeSel = wrap.querySelector('#dtf-margin-mode');
            var valInp = wrap.querySelector('#dtf-margin-value');
            var unitSpan = wrap.querySelector('#dtf-margin-unit');
            function syncMargin(){
              var mode = modeSel.value;
              window.__DTF_EXPORT_MARGIN = { mode: mode, value: Number(valInp.value) || 0 };
              if (mode === 'auto') {
                valInp.style.display = 'none'; unitSpan.style.display = 'none';
              } else {
                valInp.style.display = ''; unitSpan.style.display = '';
                if (mode === 'percent') { unitSpan.textContent = '%'; valInp.value = valInp.value || 8; }
                else { unitSpan.textContent = 'mm'; valInp.value = valInp.value || 15; }
                window.__DTF_EXPORT_MARGIN.value = Number(valInp.value) || 0;
              }
            }
            modeSel.addEventListener('change', syncMargin);
            valInp.addEventListener('input', syncMargin);
            syncMargin();
          }

          if (!document.getElementById('dtf-a4-export-btn')) {
            var btn4 = document.createElement('button');
            btn4.id = 'dtf-a4-export-btn';
            btn4.type = 'button';
            btn4.className = master.className;
            btn4.textContent = 'Salvar PNG A4 (300 DPI)';
            btn4.addEventListener('click', function(e){
              e.preventDefault(); e.stopPropagation();
              window.__DTF_EXPORT_A4_NEXT = true;
              master.click();
            });
            master.parentElement.appendChild(btn4);
          }
          if (!document.getElementById('dtf-a3-export-btn')) {
            var btn3 = document.createElement('button');
            btn3.id = 'dtf-a3-export-btn';
            btn3.type = 'button';
            btn3.className = master.className;
            btn3.textContent = 'Salvar PNG A3 (300 DPI)';
            btn3.addEventListener('click', function(e){
              e.preventDefault(); e.stopPropagation();
              window.__DTF_EXPORT_A3_NEXT = true;
              master.click();
            });
            master.parentElement.appendChild(btn3);
          }
        }

        document.addEventListener('DOMContentLoaded', installSizeButtons);
        new MutationObserver(installSizeButtons).observe(document.documentElement, { childList: true, subtree: true });
        window.__DTF_FORCE_300_DPI = { readPhys: readPhys, setDpi: setDpi, ensureDpi: ensureDpi, a4: [A4_WIDTH, A4_HEIGHT], a3: [A3_WIDTH, A3_HEIGHT] };
      })();
    </script>
