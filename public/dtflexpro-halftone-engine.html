<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reticula Studio — DTFLEXPRO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff3366, #ff6b35);
    padding: 16px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(255,51,102,0.3);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  .container {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    gap: 0;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
  }
  .sidebar {
    background: #141414;
    padding: 24px;
    border-right: 1px solid #2a2a2a;
    overflow-y: auto;
  }
  .preview-area {
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    background: repeating-conic-gradient(#1a1a1a 0% 25%, #222 0% 50%) 50%/20px 20px;
  }
  .control-group { margin-bottom: 20px; }
  .control-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: #ff6b35;
  }
  .control-group input[type="range"] {
    width: 100%;
    accent-color: #ff3366;
  }
  .control-group .value {
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
  }
  .mode-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }
  .mode-toggle button {
    flex: 1;
    padding: 12px;
    background: #1a1a1a;
    color: #888;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .mode-toggle button.active {
    background: linear-gradient(135deg, #ff3366, #ff6b35);
    color: #fff;
  }
  .file-input {
    margin-bottom: 20px;
  }
  .file-input label {
    display: block;
    padding: 12px;
    background: #2a2a2a;
    border: 2px dashed #444;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .file-input label:hover {
    border-color: #ff6b35;
    background: #2f2f2f;
  }
  .file-input input { display: none; }
  .btn-process, .btn-download {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }
  .btn-process {
    background: linear-gradient(135deg, #ff3366, #ff6b35);
    color: #fff;
  }
  .btn-process:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,51,102,0.4);
  }
  .btn-process:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-download {
    background: #00cc66;
    color: #fff;
  }
  .btn-download:hover { background: #00e673; }
  .btn-download:disabled { opacity: 0.4; cursor: not-allowed; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3366, #ff6b35);
    width: 0%;
    transition: width 0.2s;
  }
  .status {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    min-height: 14px;
  }
  #previewCanvas {
    max-width: 100%;
    max-height: 70vh;
    background:
      repeating-conic-gradient(#222 0% 25%, #2a2a2a 0% 50%) 50%/20px 20px;
    border: 1px solid #333;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .info-text {
    font-size: 11px;
    color: #666;
    margin-top: 6px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<header>
  <h1>🎨 RETICULA STUDIO — DTFLEXPRO</h1>
  <p>RGB Halftone Engine • Sem preto • Retícula vazada transparente • 3307×4930px</p>
</header>

<div class="container">
  <aside class="sidebar">
    <div class="mode-toggle">
      <button id="modeClean" class="active" data-mode="clean">CLEAN RGB</button>
      <button id="modeRosette" data-mode="rosette">ROSETTE RGB</button>
    </div>

    <div class="file-input">
      <label for="imageInput">📁 Selecionar Imagem (PNG/JPG)</label>
      <input type="file" id="imageInput" accept="image/*" />
      <p class="info-text">Preto vira transparente. Branco vira retícula branca real (sem buraco). Alta definição para DTF têxtil.</p>
    </div>

    <div class="control-group">
      <label>LPI (linhas/polegada)</label>
      <input type="range" id="lpi" min="22" max="55" value="32" />
      <div class="value" id="lpiVal">32 LPI</div>
    </div>

    <div class="control-group">
      <label>Ângulo Base</label>
      <input type="range" id="angle" min="0" max="90" value="45" />
      <div class="value" id="angleVal">45°</div>
    </div>

    <div class="control-group">
      <label>Aura (px)</label>
      <input type="range" id="aura" min="0" max="400" value="180" />
      <div class="value" id="auraVal">180 px</div>
    </div>

    <div class="control-group">
      <label>Contraste (+%)</label>
      <input type="range" id="contrast" min="0" max="60" value="20" />
      <div class="value" id="contrastVal">20%</div>
    </div>

    <button id="processBtn" class="btn-process" disabled>⚡ Processar</button>
    <button id="downloadBtn" class="btn-download" disabled>⬇ Download PNG</button>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="statusText">Aguardando imagem...</div>
  </aside>

  <main class="preview-area">
    <canvas id="previewCanvas"></canvas>
  </main>
</div>

<script>
const OUT_W = 3307, OUT_H = 4930;
const BLACK_LUMA_CUTOFF = 38;
const BLACK_CHANNEL_CUTOFF = 50;
let sourceImage = null;
let mode = 'clean';
let outputBlob = null;

const $ = id => document.getElementById(id);
const previewCanvas = $('previewCanvas');
const pctx = previewCanvas.getContext('2d');

// === Sliders ===
['lpi','angle','aura','contrast'].forEach(id => {
  const el = $(id);
  el.addEventListener('input', () => {
    const suffix = id === 'lpi' ? ' LPI' : id === 'angle' ? '°' : id === 'aura' ? ' px' : '%';
    $(id+'Val').textContent = el.value + suffix;
  });
});

// === Mode toggle ===
document.querySelectorAll('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

// === File input ===
$('imageInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    sourceImage = img;
    $('processBtn').disabled = false;
    $('statusText').textContent = `Imagem carregada: ${img.width}×${img.height}`;
    drawPreviewSource(img);
  };
  img.src = URL.createObjectURL(file);
});

function drawPreviewSource(img){
  const ratio = OUT_W / OUT_H;
  const maxW = 600, maxH = 600 / ratio;
  previewCanvas.width = maxW;
  previewCanvas.height = maxH;
  pctx.clearRect(0,0,maxW,maxH);
  // fit-cover
  const ir = img.width / img.height;
  let dw = maxW, dh = maxW / ir;
  if (dh < maxH) { dh = maxH; dw = maxH * ir; }
  pctx.drawImage(img, (maxW-dw)/2, (maxH-dh)/2, dw, dh);
}

function setProgress(p, msg){
  $('progressFill').style.width = (p*100)+'%';
  if (msg) $('statusText').textContent = msg;
}

function lumaAt(data, i){
  return 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
}

function isBlackPixel(data, i){
  const r = data[i], g = data[i+1], b = data[i+2];
  const l = 0.299*r + 0.587*g + 0.114*b;
  return l <= BLACK_LUMA_CUTOFF && r <= BLACK_CHANNEL_CUTOFF && g <= BLACK_CHANNEL_CUTOFF && b <= BLACK_CHANNEL_CUTOFF;
}

function dotRadiusForLuma(luma, cell){
  // Mapeia luminância (0=preto, 255=branco) para raio do ponto.
  // Preto já foi descartado (transparente). Branco gera ponto PEQUENO mas real (sem buraco).
  // Para DTF têxtil: dots robustos, alta definição, mínimo imprimível ~1.4px.
  const maxR = cell * 0.48;   // sombras (escuro = ponto grande)
  const minR = Math.max(1.4, cell * 0.16); // luzes/branco = ponto pequeno mas visível
  // Inverter: quanto menor a luma (mais escuro), maior o raio
  const t = 1 - (luma / 255); // 0 = branco, 1 = preto
  // curva suave
  const eased = Math.pow(t, 0.85);
  return minR + eased * (maxR - minR);
}

function triggerDownload(){
  if (!outputBlob) return;
  const url = URL.createObjectURL(outputBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dtflex-reticula-sem-preto-${mode}-${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// === Process ===
$('processBtn').addEventListener('click', async () => {
  if (!sourceImage) return;
  $('processBtn').disabled = true;
  $('downloadBtn').disabled = true;
  outputBlob = null;

  setProgress(0.05, 'Preparando canvas...');
  await new Promise(r => requestAnimationFrame(r));

  // Source canvas at output resolution
  const src = document.createElement('canvas');
  src.width = OUT_W; src.height = OUT_H;
  const sctx = src.getContext('2d');
  // Fit image cover
  const ir = sourceImage.width / sourceImage.height;
  const or = OUT_W / OUT_H;
  let dw, dh, dx, dy;
  if (ir > or) { dh = OUT_H; dw = OUT_H * ir; dx = (OUT_W-dw)/2; dy = 0; }
  else { dw = OUT_W; dh = OUT_W / ir; dx = 0; dy = (OUT_H-dh)/2; }
  sctx.drawImage(sourceImage, dx, dy, dw, dh);

  setProgress(0.15, 'Aplicando contraste...');
  await new Promise(r => requestAnimationFrame(r));

  const imgData = sctx.getImageData(0,0,OUT_W,OUT_H);
  const data = imgData.data;
  const cBoost = parseInt($('contrast').value)/100;
  // Simple contrast boost around 128
  const f = (1 + cBoost);
  for (let i=0;i<data.length;i+=4){
    data[i]   = Math.max(0, Math.min(255, (data[i]  -128)*f + 128));
    data[i+1] = Math.max(0, Math.min(255, (data[i+1]-128)*f + 128));
    data[i+2] = Math.max(0, Math.min(255, (data[i+2]-128)*f + 128));
  }
  sctx.putImageData(imgData, 0, 0);

  setProgress(0.3, 'Detectando máscara...');
  await new Promise(r => requestAnimationFrame(r));

  // Build print mask: alpha/subject minus black and protected white/text areas.
  const mask = new Uint8Array(OUT_W * OUT_H);
  const whiteMask = new Uint8Array(OUT_W * OUT_H);
  let alphaCount = 0;
  for (let y=0,i=0,p=0; y<OUT_H; y++){
    for (let x=0; x<OUT_W; x++, i+=4, p++){
      if (data[i+3] < 250) alphaCount++;
    }
  }
  const useAlpha = alphaCount > 5000;
  for (let i=0,p=0; p<mask.length; i+=4, p++){
    if (isBlackPixel(data, i)) {
      data[i+3] = 0;
      mask[p] = 0;
      continue;
    }
    if (isProtectedWhite(data, i)) {
      whiteMask[p] = 1;
      mask[p] = 0;
      continue;
    }
    if (useAlpha){
      mask[p] = data[i+3] > 30 ? 1 : 0;
    } else {
      const L = lumaAt(data, i);
      mask[p] = L < WHITE_LUMA_KEEP ? 1 : 0; // white/text is preserved, not halftoned
    }
  }

  setProgress(0.45, 'Calculando aura (distância)...');
  await new Promise(r => requestAnimationFrame(r));

  const auraPx = parseInt($('aura').value);
  // Distance transform: distance from each background pixel to nearest subject pixel (in px)
  const dist = computeDistanceOutside(mask, OUT_W, OUT_H, auraPx);

  setProgress(0.6, 'Renderizando reticula...');
  await new Promise(r => requestAnimationFrame(r));

  // Output canvas (transparent)
  const out = document.createElement('canvas');
  out.width = OUT_W; out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.clearRect(0,0,OUT_W,OUT_H);

  const lpi = parseInt($('lpi').value);
  const dpi = 300;
  const cell = Math.max(4, Math.round(dpi / lpi)); // cell size px
  const baseAngle = parseInt($('angle').value);

  if (mode === 'clean'){
    await renderCleanRGB(octx, data, mask, dist, OUT_W, OUT_H, cell, baseAngle, auraPx);
  } else {
    await renderRosetteRGB(octx, data, mask, dist, OUT_W, OUT_H, cell, baseAngle, auraPx);
  }
  restoreProtectedWhites(octx, data, whiteMask, OUT_W, OUT_H);

  setProgress(0.95, 'Gerando PNG...');
  await new Promise(r => requestAnimationFrame(r));

  out.toBlob(blob => {
    outputBlob = blob;
    setProgress(1, '✅ Pronto! Download iniciado.');
    $('downloadBtn').disabled = false;
    $('processBtn').disabled = false;

    // Preview
    const ratio = OUT_W / OUT_H;
    const maxW = 600, maxH = 600/ratio;
    previewCanvas.width = maxW;
    previewCanvas.height = maxH;
    pctx.clearRect(0,0,maxW,maxH);
    pctx.drawImage(out, 0, 0, maxW, maxH);
    triggerDownload();
  }, 'image/png');
});

// === Distance transform (two-pass chamfer) — distance OUTSIDE subject only ===
function computeDistanceOutside(mask, W, H, maxDist){
  const INF = 1e9;
  const d = new Float32Array(W*H);
  for (let i=0;i<d.length;i++) d[i] = mask[i] ? 0 : INF;
  // forward pass
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const i = y*W+x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x>0)   v = Math.min(v, d[i-1]+1);
      if (y>0)   v = Math.min(v, d[i-W]+1);
      if (x>0 && y>0) v = Math.min(v, d[i-W-1]+1.414);
      if (x<W-1 && y>0) v = Math.min(v, d[i-W+1]+1.414);
      d[i] = v;
    }
  }
  // backward pass
  for (let y=H-1; y>=0; y--){
    for (let x=W-1; x>=0; x--){
      const i = y*W+x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x<W-1) v = Math.min(v, d[i+1]+1);
      if (y<H-1) v = Math.min(v, d[i+W]+1);
      if (x<W-1 && y<H-1) v = Math.min(v, d[i+W+1]+1.414);
      if (x>0 && y<H-1) v = Math.min(v, d[i+W-1]+1.414);
      d[i] = v;
    }
  }
  return d;
}

function restoreProtectedWhites(ctx, data, whiteMask, W, H){
  const white = ctx.createImageData(W, H);
  const out = white.data;
  for (let p=0,i=0; p<whiteMask.length; p++, i+=4){
    if (!whiteMask[p]) continue;
    out[i] = data[i];
    out[i+1] = data[i+1];
    out[i+2] = data[i+2];
    out[i+3] = data[i+3];
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.putImageData(white, 0, 0);
}

// === CLEAN RGB: single rotated grid sampling colors ===
async function renderCleanRGB(ctx, data, mask, dist, W, H, cell, angleDeg, auraPx){
  const rad = angleDeg * Math.PI / 180;
  const cosA = Math.cos(rad), sinA = Math.sin(rad);
  // iterate in rotated grid space
  // get bounding box of rotated grid covering W×H
  const diag = Math.ceil(Math.sqrt(W*W + H*H));
  const half = diag / 2;
  const cx = W/2, cy = H/2;

  ctx.globalCompositeOperation = 'source-over';

  for (let gy = -half; gy <= half; gy += cell){
    for (let gx = -half; gx <= half; gx += cell){
      // rotate (gx,gy) back to image coords
      const ix = Math.round(cx + gx*cosA - gy*sinA);
      const iy = Math.round(cy + gx*sinA + gy*cosA);
      if (ix<0||iy<0||ix>=W||iy>=H) continue;

      const p = iy*W + ix;
      const inside = mask[p] === 1;
      const distOut = dist[p]; // 0 if inside, else distance to subject

      // skip pure background outside aura
      if (!inside && distOut > auraPx) continue;

      const di = p*4;
      if (isBlackPixel(data, di) || isProtectedWhite(data, di)) continue;
      const r = data[di], g = data[di+1], b = data[di+2];
      const L = lumaAt(data, di);

      // Black is never printed. Whites/text are restored later without halftone.
      let radius = dotRadiusForLuma(L, cell);
      if (radius <= 0) continue;
      let alpha = L >= 205 ? 0.8 : 1.0;

      if (!inside){
        // aura fade: linear shrink + alpha fade
        const fade = 1 - (distOut / auraPx); // 1 at edge → 0 at end
        radius *= fade;
        alpha = fade;
        if (radius < 0.35 || alpha < 0.05) continue;
      }

      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(ix, iy, radius, 0, Math.PI*2);
      ctx.fill();
    }
    if (gy % (cell*40) === 0) {
      const prog = 0.6 + 0.3 * ((gy+half)/diag);
      setProgress(prog, 'Renderizando reticula...');
      await new Promise(r => setTimeout(r, 0));
    }
  }
}

// === ROSETTE RGB: 3 channels at classic-ish angles, additive blend ===
async function renderRosetteRGB(ctx, data, mask, dist, W, H, cell, baseAngle, auraPx){
  const channels = [
    { idx: 0, angle: 15, color: [255,0,0] },
    { idx: 1, angle: 75, color: [0,255,0] },
    { idx: 2, angle: 0,  color: [0,0,255] },
  ];

  ctx.globalCompositeOperation = 'lighter'; // additive

  for (let ch=0; ch<channels.length; ch++){
    const { idx, angle, color } = channels[ch];
    const rad = (angle + baseAngle - 45) * Math.PI/180;
    const cosA = Math.cos(rad), sinA = Math.sin(rad);
    const maxR = cell * 0.38;
    const minR = Math.max(0.32, cell * 0.04);
    const diag = Math.ceil(Math.sqrt(W*W + H*H));
    const half = diag/2;
    const cx = W/2, cy = H/2;

    for (let gy=-half; gy<=half; gy+=cell){
      for (let gx=-half; gx<=half; gx+=cell){
        const ix = Math.round(cx + gx*cosA - gy*sinA);
        const iy = Math.round(cy + gx*sinA + gy*cosA);
        if (ix<0||iy<0||ix>=W||iy>=H) continue;
        const p = iy*W + ix;
        const inside = mask[p] === 1;
        const distOut = dist[p];
        if (!inside && distOut > auraPx) continue;

        const di = p*4;
        if (isBlackPixel(data, di) || isProtectedWhite(data, di)) continue;
        const L = lumaAt(data, di);
        const v = data[di + idx]; // channel value 0..255
        if (L >= WHITE_LUMA_KEEP) continue;
        const t = Math.max(0.05, v / 255);
        let radius = minR + t * (maxR - minR);
        let alpha = L >= 205 ? 0.42 : 0.74;

        if (!inside){
          const fade = 1 - (distOut/auraPx);
          radius *= fade;
          alpha *= fade;
          if (radius < 0.35 || alpha < 0.05) continue;
        }

        ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(ix, iy, radius, 0, Math.PI*2);
        ctx.fill();
      }
      if (gy % (cell*40) === 0){
        const prog = 0.6 + 0.3 * ((ch + (gy+half)/diag)/channels.length);
        setProgress(prog, `Renderizando canal ${'RGB'[ch]}...`);
        await new Promise(r => setTimeout(r, 0));
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// === Download ===
$('downloadBtn').addEventListener('click', () => {
  triggerDownload();
});
</script>
</body>
</html>
