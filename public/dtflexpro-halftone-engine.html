<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reticula Studio — DTFLEXPRO</title>
<style>
  :root {
    --bg-0: #07090d;
    --bg-1: #0d1016;
    --bg-2: #141822;
    --bg-3: #1a1f2c;
    --line: #232938;
    --line-2: #2d3548;
    --text: #ecf2fb;
    --muted: #8a93a8;
    --gold: #f5c542;
    --gold-2: #ffd76a;
    --neon-blue: #1cd0ff;
    --neon-green: #2bff9c;
    --danger: #ff4d6d;
    --shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(28,208,255,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(43,255,156,0.08), transparent 60%),
      radial-gradient(700px 400px at 50% 50%, rgba(245,197,66,0.04), transparent 70%),
      var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(10px);
    background: rgba(7,9,13,0.7);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: conic-gradient(from 180deg, var(--neon-blue), var(--gold), var(--neon-green), var(--neon-blue));
    box-shadow: 0 0 24px rgba(28,208,255,0.35), inset 0 0 8px rgba(0,0,0,0.4);
    position: relative;
  }
  .logo::after {
    content: ""; position: absolute; inset: 6px; border-radius: 7px;
    background: var(--bg-0);
  }
  .logo::before {
    content: ""; position: absolute; inset: 12px; border-radius: 50%;
    background: radial-gradient(circle, var(--gold), transparent 70%);
    z-index: 2;
  }
  .brand h1 {
    font-size: 17px; margin: 0; letter-spacing: 1px; font-weight: 700;
    background: linear-gradient(90deg, #fff, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand .sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .upgrade-btn {
    padding: 10px 20px; border-radius: 10px; border: 1px solid rgba(245,197,66,0.5);
    background: linear-gradient(135deg, rgba(245,197,66,0.15), rgba(255,215,106,0.05));
    color: var(--gold-2); font-weight: 600; font-size: 13px; cursor: pointer;
    letter-spacing: 0.5px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(245,197,66,0.15);
  }
  .upgrade-btn:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(245,197,66,0.4); }

  .layout {
    display: grid; grid-template-columns: 340px 1fr;
    gap: 22px; padding: 22px; min-height: calc(100vh - 76px);
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .sidebar {
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: flex; flex-direction: column; gap: 18px;
    box-shadow: var(--shadow);
    height: fit-content; position: sticky; top: 96px;
  }

  .upload-zone {
    border: 2px dashed var(--line-2); border-radius: 14px;
    padding: 22px 16px; text-align: center; cursor: pointer;
    background: linear-gradient(180deg, rgba(28,208,255,0.04), rgba(43,255,156,0.02));
    transition: all 0.25s;
  }
  .upload-zone:hover, .upload-zone.drag {
    border-color: var(--neon-blue);
    background: linear-gradient(180deg, rgba(28,208,255,0.12), rgba(43,255,156,0.06));
    box-shadow: 0 0 24px rgba(28,208,255,0.2);
  }
  .upload-zone .icon { font-size: 28px; margin-bottom: 6px; }
  .upload-zone .title { font-weight: 600; font-size: 14px; }
  .upload-zone .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .group { display: flex; flex-direction: column; gap: 10px; }
  .group-label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }

  /* Toggle Switch */
  .mode-toggle {
    position: relative; display: flex; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px;
    overflow: hidden;
  }
  .mode-toggle .slide {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px); border-radius: 9px;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
    box-shadow: 0 0 18px rgba(28,208,255,0.4);
    transition: transform 0.3s cubic-bezier(.5,.2,.2,1);
  }
  .mode-toggle.rosette .slide {
    transform: translateX(100%);
    background: linear-gradient(135deg, var(--gold), #ff6ed4);
    box-shadow: 0 0 18px rgba(245,197,66,0.4);
  }
  .mode-toggle button {
    flex: 1; position: relative; z-index: 2;
    background: transparent; border: 0; color: var(--text);
    padding: 12px 8px; cursor: pointer; font-weight: 700;
    font-size: 12px; letter-spacing: 1px;
  }
  .mode-toggle button.active { color: #07090d; }

  /* Sliders */
  .slider-row {
    display: flex; flex-direction: column; gap: 6px;
  }
  .slider-row .label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .slider-row .label strong { color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%;
    height: 6px; background: var(--bg-2); border-radius: 4px;
    outline: none; border: 1px solid var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-blue), var(--gold));
    cursor: pointer; border: 2px solid var(--bg-0);
    box-shadow: 0 0 12px rgba(28,208,255,0.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-blue), var(--gold));
    cursor: pointer; border: 2px solid var(--bg-0);
  }

  .extras { display: none; flex-direction: column; gap: 12px; padding-top: 4px; }
  .extras.show { display: flex; }

  .btn {
    padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
    color: #07090d;
    box-shadow: 0 0 24px rgba(28,208,255,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(28,208,255,0.6); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #1a1207;
    box-shadow: 0 0 24px rgba(245,197,66,0.3);
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(245,197,66,0.55); }
  .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Main Preview */
  .main {
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 16px;
    min-height: 70vh;
  }
  .main-head {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  .main-title {
    font-size: 18px; font-weight: 700; margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .pill {
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
    background: var(--bg-2); border: 1px solid var(--line);
    color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
  }
  .pill.live {
    background: rgba(43,255,156,0.12); color: var(--neon-green);
    border-color: rgba(43,255,156,0.4);
  }
  .preview-wrap {
    flex: 1; background:
      repeating-conic-gradient(#0d1016 0% 25%, #14182280 0% 50%) 50% / 24px 24px;
    border-radius: 12px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative; min-height: 480px;
  }
  #previewCanvas {
    max-width: 100%; max-height: 70vh; display: block;
    border-radius: 8px;
    image-rendering: -webkit-optimize-contrast;
  }
  .placeholder {
    color: var(--muted); text-align: center; padding: 40px;
  }
  .placeholder .big { font-size: 56px; margin-bottom: 12px; opacity: 0.4; }

  /* Loader */
  .loader-overlay {
    position: absolute; inset: 0; background: rgba(7,9,13,0.85);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; backdrop-filter: blur(6px);
    border-radius: 12px; z-index: 5;
  }
  .loader-overlay.show { display: flex; }
  .spinner {
    width: 70px; height: 70px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--neon-blue), var(--gold), var(--neon-green), var(--neon-blue));
    -webkit-mask: radial-gradient(circle 26px at center, transparent 99%, #000 100%);
            mask: radial-gradient(circle 26px at center, transparent 99%, #000 100%);
    animation: spin 1.1s linear infinite;
    box-shadow: 0 0 30px rgba(28,208,255,0.5);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-weight: 600; letter-spacing: 1px; font-size: 13px;
    color: var(--text); text-transform: uppercase;
  }
  .loader-progress {
    width: 240px; height: 6px; background: var(--bg-2);
    border-radius: 4px; overflow: hidden; border: 1px solid var(--line);
  }
  .loader-progress > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--neon-blue), var(--gold), var(--neon-green));
    transition: width 0.2s;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-2); border: 1px solid var(--line);
    padding: 12px 22px; border-radius: 12px; font-size: 13px;
    box-shadow: var(--shadow); opacity: 0; transition: all 0.25s;
    z-index: 50; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(43,255,156,0.5); color: var(--neon-green); }
  .toast.err { border-color: rgba(255,77,109,0.5); color: var(--danger); }

  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>RETICULA STUDIO</h1>
      <div class="sub">DTFLEXPRO · PRO ENGINE</div>
    </div>
  </div>
  <button class="upgrade-btn" onclick="toast('Plano PRO em breve ✨','ok')">⚡ Upgrade PRO</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <label class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" />
      <div class="icon">📤</div>
      <div class="title">Carregar Imagem</div>
      <div class="hint">Clique ou arraste · PNG / JPG</div>
    </label>

    <div class="group">
      <div class="group-label">Modo de Reticula</div>
      <div class="mode-toggle" id="modeToggle">
        <div class="slide"></div>
        <button data-mode="round" class="active">ROUND CLEAN</button>
        <button data-mode="rosette">ROSETTE CMYK</button>
      </div>
    </div>

    <div class="group">
      <div class="slider-row">
        <div class="label">LPI (Linhas/Polegada) <strong id="lpiVal">32</strong></div>
        <input type="range" id="lpi" min="22" max="45" value="32" step="1" />
      </div>
    </div>

    <div class="extras show" id="roundExtras">
      <div class="slider-row">
        <div class="label">Intensidade da Aura <strong id="auraVal">70</strong></div>
        <input type="range" id="aura" min="0" max="100" value="70" step="1" />
      </div>
      <div class="slider-row">
        <div class="label">Tamanho do Splatter <strong id="splatVal">55</strong></div>
        <input type="range" id="splat" min="10" max="100" value="55" step="1" />
      </div>
    </div>

    <button class="btn btn-primary" id="generateBtn" disabled>✨ Gerar Reticula</button>
    <button class="btn btn-gold" id="downloadBtn" disabled>⬇️ Baixar PNG 3307×4930</button>
  </aside>

  <section class="main">
    <div class="main-head">
      <h2 class="main-title">🎨 Preview <span class="pill live" id="modePill">ROUND CLEAN</span></h2>
      <div class="pill">3307 × 4930 px · 300 DPI · Fundo Transparente</div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <div class="placeholder" id="placeholder">
        <div class="big">🖼️</div>
        <div>Carregue uma imagem para começar</div>
      </div>
      <canvas id="previewCanvas" style="display:none"></canvas>
      <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Processando...</div>
        <div class="loader-progress"><div id="loaderBar"></div></div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   RETICULA STUDIO — Vanilla JS Halftone Engine
   - ROUND CLEAN: subject dots + colored aura splatter
   - ROSETTE CMYK: 4-channel rotated grids (15°, 75°, 0°, 45°)
   - Output: 3307 × 4930 PNG, transparent background
   ============================================================ */

const OUT_W = 3307;
const OUT_H = 4930;

const els = {
  fileInput: document.getElementById('fileInput'),
  dropZone: document.getElementById('dropZone'),
  modeToggle: document.getElementById('modeToggle'),
  modePill: document.getElementById('modePill'),
  lpi: document.getElementById('lpi'),
  lpiVal: document.getElementById('lpiVal'),
  aura: document.getElementById('aura'),
  auraVal: document.getElementById('auraVal'),
  splat: document.getElementById('splat'),
  splatVal: document.getElementById('splatVal'),
  roundExtras: document.getElementById('roundExtras'),
  generateBtn: document.getElementById('generateBtn'),
  downloadBtn: document.getElementById('downloadBtn'),
  preview: document.getElementById('previewCanvas'),
  placeholder: document.getElementById('placeholder'),
  loader: document.getElementById('loader'),
  loaderText: document.getElementById('loaderText'),
  loaderBar: document.getElementById('loaderBar'),
  toast: document.getElementById('toast'),
};

let state = {
  mode: 'round',
  img: null,
  resultBlob: null,
};

/* ---------- UI bindings ---------- */
els.lpi.oninput = () => els.lpiVal.textContent = els.lpi.value;
els.aura.oninput = () => els.auraVal.textContent = els.aura.value;
els.splat.oninput = () => els.splatVal.textContent = els.splat.value;

els.modeToggle.querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    state.mode = b.dataset.mode;
    els.modeToggle.classList.toggle('rosette', state.mode === 'rosette');
    els.modeToggle.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    els.modePill.textContent = state.mode === 'round' ? 'ROUND CLEAN' : 'ROSETTE CMYK';
    els.roundExtras.classList.toggle('show', state.mode === 'round');
  };
});

els.dropZone.onclick = () => els.fileInput.click();
els.dropZone.ondragover = e => { e.preventDefault(); els.dropZone.classList.add('drag'); };
els.dropZone.ondragleave = () => els.dropZone.classList.remove('drag');
els.dropZone.ondrop = e => {
  e.preventDefault(); els.dropZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
};
els.fileInput.onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };

function handleFile(file) {
  if (!file.type.startsWith('image/')) { toast('Arquivo inválido', 'err'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      state.img = img;
      els.generateBtn.disabled = false;
      els.downloadBtn.disabled = true;
      toast('Imagem carregada · clique em Gerar', 'ok');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

els.generateBtn.onclick = () => generate();
els.downloadBtn.onclick = () => downloadPNG();

function showLoader(text) {
  els.loader.classList.add('show');
  els.loaderText.textContent = text || 'Processando...';
  els.loaderBar.style.width = '0%';
}
function setProgress(p, text) {
  els.loaderBar.style.width = (p * 100) + '%';
  if (text) els.loaderText.textContent = text;
}
function hideLoader() { els.loader.classList.remove('show'); }

function toast(msg, kind) {
  els.toast.textContent = msg;
  els.toast.className = 'toast show ' + (kind || '');
  clearTimeout(els.toast._t);
  els.toast._t = setTimeout(() => els.toast.classList.remove('show'), 2400);
}

/* ============================================================
   MAIN GENERATE
   ============================================================ */
async function generate() {
  if (!state.img) return;
  els.generateBtn.disabled = true;
  els.downloadBtn.disabled = true;
  showLoader('Iniciando engine...');

  // Yield to render loader
  await new Promise(r => setTimeout(r, 30));

  try {
    const t0 = performance.now();
    let canvas;
    if (state.mode === 'round') {
      canvas = await renderRoundClean(state.img, +els.lpi.value, +els.aura.value, +els.splat.value);
    } else {
      canvas = await renderRosetteCMYK(state.img, +els.lpi.value);
    }
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    setProgress(1, 'Finalizando...');
    await new Promise(r => setTimeout(r, 50));

    // Display preview (downscaled)
    const pCanvas = els.preview;
    const maxW = 1100, maxH = 1500;
    const scale = Math.min(maxW / canvas.width, maxH / canvas.height);
    pCanvas.width = Math.round(canvas.width * scale);
    pCanvas.height = Math.round(canvas.height * scale);
    const pctx = pCanvas.getContext('2d');
    pctx.imageSmoothingQuality = 'high';
    pctx.drawImage(canvas, 0, 0, pCanvas.width, pCanvas.height);
    pCanvas.style.display = 'block';
    els.placeholder.style.display = 'none';

    // Save full resolution blob for download
    setProgress(1, 'Empacotando PNG...');
    canvas.toBlob(blob => {
      state.resultBlob = blob;
      els.downloadBtn.disabled = false;
      els.generateBtn.disabled = false;
      hideLoader();
      toast(`Pronto em ${elapsed}s · clique em Baixar`, 'ok');
    }, 'image/png');
  } catch (err) {
    console.error(err);
    hideLoader();
    els.generateBtn.disabled = false;
    toast('Erro ao processar', 'err');
  }
}

function downloadPNG() {
  if (!state.resultBlob) return;
  const url = URL.createObjectURL(state.resultBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dtflexpro-${state.mode}-${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
}

/* ============================================================
   IMAGE PREP — fit src into OUT_W x OUT_H, center, fill transparent
   Returns { srcImageData, work canvas }
   ============================================================ */
function prepareSource(img, workW, workH) {
  // Fit image inside workW x workH preserving aspect, center
  const ar = img.width / img.height;
  const tar = workW / workH;
  let dw, dh;
  if (ar > tar) { dw = workW; dh = workW / ar; }
  else          { dh = workH; dw = workH * ar; }
  const dx = (workW - dw) / 2;
  const dy = (workH - dh) / 2;

  const cv = document.createElement('canvas');
  cv.width = workW; cv.height = workH;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, dx, dy, dw, dh);
  return { canvas: cv, ctx, dx, dy, dw, dh };
}

/* ============================================================
   ROUND CLEAN — single grid, perfect round dots,
   subject dots driven by luminance, colored aura splatter outside
   ============================================================ */
async function renderRoundClean(img, lpi, auraIntensity, splatSize) {
  // Work at a manageable resolution then upscale dot positions to OUT
  const WORK_LONG = 1400; // performance target
  const ar = img.width / img.height;
  let workW, workH;
  // Use OUT aspect for output mapping
  const outAr = OUT_W / OUT_H;
  // Use output aspect so layout matches final
  if (outAr > 1) { workW = WORK_LONG; workH = Math.round(WORK_LONG / outAr); }
  else            { workH = WORK_LONG; workW = Math.round(WORK_LONG * outAr); }

  setProgress(0.05, 'Preparando imagem...');
  await yieldFrame();

  const { canvas: srcCv } = prepareSource(img, workW, workH);
  const sctx = srcCv.getContext('2d');
  const srcData = sctx.getImageData(0, 0, workW, workH);

  // Build luminance + alpha-presence (subject mask = non-transparent / non-white edge)
  setProgress(0.15, 'Analisando sujeito...');
  await yieldFrame();
  const lum = new Float32Array(workW * workH);
  const subj = new Uint8Array(workW * workH); // 1 if pixel belongs to "subject"
  for (let i = 0, p = 0; i < lum.length; i++, p += 4) {
    const r = srcData.data[p], g = srcData.data[p+1], b = srcData.data[p+2], a = srcData.data[p+3];
    const L = (0.299*r + 0.587*g + 0.114*b) / 255;
    lum[i] = L;
    // Subject = pixel that has alpha and is not pure white (treat near-white as background)
    const isWhiteBg = (r > 245 && g > 245 && b > 245);
    subj[i] = (a > 16 && !isWhiteBg) ? 1 : 0;
  }

  // Distance map from subject edge (outside) — for aura intensity falloff
  setProgress(0.3, 'Calculando aura...');
  await yieldFrame();
  const dist = computeDistanceOutside(subj, workW, workH);

  // Create output canvas at full resolution
  setProgress(0.45, 'Gerando pontos...');
  await yieldFrame();
  const out = document.createElement('canvas');
  out.width = OUT_W; out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.clearRect(0, 0, OUT_W, OUT_H);

  // Cell size in OUTPUT pixels: based on LPI + 300 DPI
  const cellOut = Math.max(4, Math.round(300 / lpi));   // out px per cell
  const cellWork = cellOut * (workW / OUT_W);            // work px per cell

  const colsCount = Math.ceil(OUT_W / cellOut);
  const rowsCount = Math.ceil(OUT_H / cellOut);

  const minDot = 1.6;
  const maxDot = cellOut * 0.55;

  // Precompute aura distance threshold (work px)
  const auraReachWork = Math.min(workW, workH) * (0.10 + (auraIntensity / 100) * 0.35);

  // ---- Subject dots (clean grid) ----
  octx.fillStyle = '#000';
  for (let ry = 0; ry < rowsCount; ry++) {
    if (ry % 24 === 0) {
      setProgress(0.45 + 0.3 * (ry / rowsCount), 'Pontos do sujeito...');
      await yieldFrame();
    }
    const cy = ry * cellOut + cellOut / 2;
    const wy = Math.floor(cy * (workH / OUT_H));
    for (let rx = 0; rx < colsCount; rx++) {
      const cx = rx * cellOut + cellOut / 2;
      const wx = Math.floor(cx * (workW / OUT_W));
      const idx = wy * workW + wx;
      if (idx < 0 || idx >= subj.length) continue;
      if (!subj[idx]) continue;

      // Sample average luminance over cell area
      const L = sampleLumAvg(lum, workW, workH, wx, wy, Math.max(1, Math.floor(cellWork * 0.5)));
      // Darker -> bigger dot. Lighter -> smaller dot but min 1.5
      const t = 1 - L; // dark = 1
      let r = minDot + t * (maxDot - minDot);
      // Sample original color
      const p = idx * 4;
      const cr = srcData.data[p], cg = srcData.data[p+1], cb = srcData.data[p+2];
      // Use tinted dark color (preserve hue but dark)
      const mix = 0.25; // amount of color
      const fr = Math.round(cr * mix);
      const fg = Math.round(cg * mix);
      const fb = Math.round(cb * mix);
      octx.fillStyle = `rgb(${fr},${fg},${fb})`;
      octx.beginPath();
      octx.arc(cx, cy, r, 0, Math.PI * 2);
      octx.fill();
    }
  }

  // ---- AURA: explosive colored splatter outside subject ----
  setProgress(0.78, 'Renderizando aura...');
  await yieldFrame();

  // Number of splatter particles scales with image area + slider
  const baseParticles = 7000;
  const particleCount = Math.round(baseParticles * (0.4 + auraIntensity / 100 * 1.6));
  const splatScale = 0.4 + (splatSize / 100) * 1.6;

  // For each particle: pick random angle around subject, distance with exp falloff
  // Sample color from nearest subject edge
  // Find edge pixels for color sampling
  const edgePixels = collectEdgePixels(subj, workW, workH);
  if (edgePixels.length === 0) {
    setProgress(1, 'Concluído');
    return out;
  }

  for (let i = 0; i < particleCount; i++) {
    if (i % 1500 === 0) {
      setProgress(0.78 + 0.18 * (i / particleCount), 'Splatter...');
      await yieldFrame();
    }
    // Pick a random edge point
    const ep = edgePixels[(Math.random() * edgePixels.length) | 0];
    // Random outward direction (use approx normal: away from centroid? use random angle for explosive look)
    const ang = Math.random() * Math.PI * 2;
    // Distance with exponential falloff so most particles near edge
    const u = Math.random();
    const distance = Math.pow(u, 1.8) * auraReachWork;
    const wx = ep.x + Math.cos(ang) * distance;
    const wy = ep.y + Math.sin(ang) * distance;
    if (wx < 0 || wy < 0 || wx >= workW || wy >= workH) continue;
    const wxi = wx | 0, wyi = wy | 0;
    const idx = wyi * workW + wxi;
    // Skip if inside subject (we want outside aura)
    if (subj[idx]) continue;

    // Sample color from edge pixel
    const ep4 = (ep.y * workW + ep.x) * 4;
    let cr = srcData.data[ep4];
    let cg = srcData.data[ep4 + 1];
    let cb = srcData.data[ep4 + 2];

    // Boost saturation for vivid explosion
    [cr, cg, cb] = boostSaturation(cr, cg, cb, 1.5);

    // Map to OUT coords
    const ox = wx * (OUT_W / workW);
    const oy = wy * (OUT_H / workH);

    // Particle size: smaller far from edge, scaled by splatScale
    const distNorm = distance / auraReachWork;
    const baseR = (minDot + Math.random() * (maxDot * 0.7)) * splatScale * (1 - distNorm * 0.6);
    if (baseR < 0.6) continue;
    // Alpha falloff
    const alpha = (1 - distNorm) * (0.6 + Math.random() * 0.4);

    octx.fillStyle = `rgba(${cr},${cg},${cb},${alpha.toFixed(3)})`;
    octx.beginPath();
    octx.arc(ox, oy, baseR, 0, Math.PI * 2);
    octx.fill();
  }

  setProgress(1, 'Concluído');
  return out;
}

/* Sample mean luminance in a small square region */
function sampleLumAvg(lum, w, h, x, y, r) {
  let s = 0, n = 0;
  const x0 = Math.max(0, x - r), x1 = Math.min(w - 1, x + r);
  const y0 = Math.max(0, y - r), y1 = Math.min(h - 1, y + r);
  for (let yy = y0; yy <= y1; yy += 2) {
    for (let xx = x0; xx <= x1; xx += 2) {
      s += lum[yy * w + xx]; n++;
    }
  }
  return n ? s / n : 0;
}

/* Boost saturation in RGB space */
function boostSaturation(r, g, b, k) {
  const avg = (r + g + b) / 3;
  return [
    Math.max(0, Math.min(255, avg + (r - avg) * k)),
    Math.max(0, Math.min(255, avg + (g - avg) * k)),
    Math.max(0, Math.min(255, avg + (b - avg) * k)),
  ].map(Math.round);
}

/* Collect pixels on edge of subject (pixel that is subject and has at least one non-subject neighbor) */
function collectEdgePixels(subj, w, h) {
  const out = [];
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const idx = y * w + x;
      if (!subj[idx]) continue;
      if (!subj[idx-1] || !subj[idx+1] || !subj[idx-w] || !subj[idx+w]) {
        out.push({ x, y });
      }
    }
  }
  return out;
}

/* Approximate distance map (in pixels) from subject for OUTSIDE pixels.
   Two-pass chamfer (5,7) for speed. Inside pixels = 0. */
function computeDistanceOutside(subj, w, h) {
  const N = w * h;
  const INF = 1e9;
  const d = new Float32Array(N);
  for (let i = 0; i < N; i++) d[i] = subj[i] ? 0 : INF;
  // Forward
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let v = d[i];
      if (x > 0)        v = Math.min(v, d[i-1] + 1);
      if (y > 0)        v = Math.min(v, d[i-w] + 1);
      if (x > 0 && y>0) v = Math.min(v, d[i-w-1] + 1.41421);
      if (x < w-1 && y>0) v = Math.min(v, d[i-w+1] + 1.41421);
      d[i] = v;
    }
  }
  // Backward
  for (let y = h - 1; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x;
      let v = d[i];
      if (x < w-1)         v = Math.min(v, d[i+1] + 1);
      if (y < h-1)         v = Math.min(v, d[i+w] + 1);
      if (x < w-1 && y<h-1) v = Math.min(v, d[i+w+1] + 1.41421);
      if (x > 0   && y<h-1) v = Math.min(v, d[i+w-1] + 1.41421);
      d[i] = v;
    }
  }
  return d;
}

/* ============================================================
   ROSETTE CMYK — 4 rotated grids of round dots
   Cyan 15°, Magenta 75°, Yellow 0°, Black 45°
   Composited multiply, transparent background
   ============================================================ */
async function renderRosetteCMYK(img, lpi) {
  const WORK_LONG = 1300;
  const outAr = OUT_W / OUT_H;
  let workW, workH;
  if (outAr > 1) { workW = WORK_LONG; workH = Math.round(WORK_LONG / outAr); }
  else            { workH = WORK_LONG; workW = Math.round(WORK_LONG * outAr); }

  setProgress(0.05, 'Preparando imagem...');
  await yieldFrame();
  const { canvas: srcCv } = prepareSource(img, workW, workH);
  const sctx = srcCv.getContext('2d');
  const srcData = sctx.getImageData(0, 0, workW, workH);

  // Convert to CMYK arrays (Float 0..1)
  setProgress(0.15, 'Separação CMYK...');
  await yieldFrame();
  const N = workW * workH;
  const C = new Float32Array(N), M = new Float32Array(N), Y = new Float32Array(N), K = new Float32Array(N);
  const ALPHA = new Uint8Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    const r = srcData.data[p] / 255, g = srcData.data[p+1] / 255, b = srcData.data[p+2] / 255;
    const a = srcData.data[p+3];
    ALPHA[i] = a;
    if (a < 16) { continue; }
    const k = 1 - Math.max(r, g, b);
    if (k >= 0.999) { K[i] = 1; continue; }
    C[i] = (1 - r - k) / (1 - k);
    M[i] = (1 - g - k) / (1 - k);
    Y[i] = (1 - b - k) / (1 - k);
    K[i] = k;
  }

  // Output canvas
  const out = document.createElement('canvas');
  out.width = OUT_W; out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.clearRect(0, 0, OUT_W, OUT_H);

  // Cell size in OUTPUT pixels
  const cellOut = Math.max(4, Math.round(300 / lpi));
  const maxDot = cellOut * 0.58;

  // Use multiply blend so overlapping dots create rosette
  octx.globalCompositeOperation = 'source-over';

  const channels = [
    { arr: C, color: [0, 174, 239],   angle: 15, name: 'Cyan' },
    { arr: M, color: [236, 0, 140],   angle: 75, name: 'Magenta' },
    { arr: Y, color: [255, 222, 23],  angle: 0,  name: 'Yellow' },
    { arr: K, color: [20, 20, 20],    angle: 45, name: 'Black' },
  ];

  for (let ci = 0; ci < channels.length; ci++) {
    const ch = channels[ci];
    setProgress(0.25 + 0.18 * ci, `Canal ${ch.name}...`);
    await yieldFrame();

    octx.globalCompositeOperation = (ci === 0) ? 'source-over' : 'multiply';

    await drawRotatedGrid(octx, ch.arr, ALPHA, workW, workH, OUT_W, OUT_H, cellOut, maxDot, ch.angle, ch.color);
  }

  octx.globalCompositeOperation = 'source-over';
  setProgress(1, 'Concluído');
  return out;
}

/* Draw one rotated halftone grid. We rotate the SAMPLING grid by `angle`,
   stepping cellOut units, sampling channel value at corresponding source pos. */
async function drawRotatedGrid(ctx, channel, alpha, workW, workH, outW, outH, cellOut, maxDot, angleDeg, color) {
  const ang = angleDeg * Math.PI / 180;
  const cosA = Math.cos(ang), sinA = Math.sin(ang);
  const cx = outW / 2, cy = outH / 2;

  // Diagonal extent
  const diag = Math.sqrt(outW * outW + outH * outH);
  const half = diag / 2 + cellOut;

  const startU = -half, endU = half;
  const startV = -half, endV = half;

  const fillColor = `rgb(${color[0]},${color[1]},${color[2]})`;
  ctx.fillStyle = fillColor;

  let row = 0;
  for (let v = startV; v <= endV; v += cellOut, row++) {
    if (row % 32 === 0) await yieldFrame();
    for (let u = startU; u <= endU; u += cellOut) {
      // Rotate (u,v) by angle around center
      const ox = cx + u * cosA - v * sinA;
      const oy = cy + u * sinA + v * cosA;
      if (ox < -cellOut || oy < -cellOut || ox > outW + cellOut || oy > outH + cellOut) continue;
      // Map to work source coords
      const wx = (ox * workW / outW) | 0;
      const wy = (oy * workH / outH) | 0;
      if (wx < 0 || wy < 0 || wx >= workW || wy >= workH) continue;
      const idx = wy * workW + wx;
      if (alpha[idx] < 16) continue;
      const val = channel[idx]; // 0..1
      if (val <= 0.02) continue;
      const r = Math.sqrt(val) * maxDot;
      if (r < 0.5) continue;
      ctx.beginPath();
      ctx.arc(ox, oy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function yieldFrame() {
  return new Promise(r => setTimeout(r, 0));
}
</script>
