<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reticula Studio — DTFLEXPRO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff3366, #ff6b35);
    padding: 16px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(255,51,102,0.3);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  .container {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    gap: 0;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
  }
  .sidebar {
    background: #141414;
    padding: 24px;
    border-right: 1px solid #2a2a2a;
    overflow-y: auto;
  }
  .preview-area {
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    background: repeating-conic-gradient(#1a1a1a 0% 25%, #222 0% 50%) 50%/20px 20px;
  }
  .control-group { margin-bottom: 20px; }
  .control-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: #ff6b35;
  }
  .control-group input[type="range"] {
    width: 100%;
    accent-color: #ff3366;
  }
  .control-group .value {
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
  }
  .file-input { margin-bottom: 20px; }
  .file-input label {
    display: block;
    padding: 12px;
    background: #2a2a2a;
    border: 2px dashed #444;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .file-input label:hover {
    border-color: #ff6b35;
    background: #2f2f2f;
  }
  .file-input input { display: none; }
  .btn-process, .btn-download {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }
  .btn-process {
    background: linear-gradient(135deg, #ff3366, #ff6b35);
    color: #fff;
  }
  .btn-process:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,51,102,0.4);
  }
  .btn-process:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-download {
    background: #00cc66;
    color: #fff;
  }
  .btn-download:hover { background: #00e673; }
  .btn-download:disabled { opacity: 0.4; cursor: not-allowed; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3366, #ff6b35);
    width: 0%;
    transition: width 0.2s;
  }
  .status {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    min-height: 14px;
    line-height: 1.35;
  }
  #previewCanvas {
    max-width: 100%;
    max-height: 70vh;
    background: repeating-conic-gradient(#222 0% 25%, #2a2a2a 0% 50%) 50%/20px 20px;
    border: 1px solid #333;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .info-text {
    font-size: 11px;
    color: #777;
    margin-top: 6px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<header>
  <h1>🎨 RETICULA STUDIO — DTFLEXPRO</h1>
  <p>Fundo removido • Preto absoluto sólido • Branco com poucas retículas • 3307×4930px</p>
</header>

<div class="container">
  <aside class="sidebar">
    <div class="file-input">
      <label for="imageInput">📁 Selecionar Imagem (PNG/JPG)</label>
      <input type="file" id="imageInput" accept="image/*" />
      <p class="info-text">Modo único: halftone normal RGB. Preto não imprime. Branco, frases e áreas brancas grandes ficam sólidos, sem retícula e sem buraco.</p>
    </div>

    <div class="control-group">
      <label>LPI (linhas/polegada)</label>
      <input type="range" id="lpi" min="26" max="42" value="34" />
      <div class="value" id="lpiVal">34 LPI</div>
    </div>

    <div class="control-group">
      <label>Ângulo</label>
      <input type="range" id="angle" min="0" max="90" value="45" />
      <div class="value" id="angleVal">45°</div>
    </div>

    <div class="control-group">
      <label>Aura (px)</label>
      <input type="range" id="aura" min="0" max="400" value="180" />
      <div class="value" id="auraVal">180 px</div>
    </div>

    <div class="control-group">
      <label>Contraste (+%)</label>
      <input type="range" id="contrast" min="0" max="40" value="18" />
      <div class="value" id="contrastVal">18%</div>
    </div>

    <button id="processBtn" class="btn-process" disabled>⚡ Processar e Baixar PNG</button>
    <button id="downloadBtn" class="btn-download" disabled>⬇ Baixar Novamente</button>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="statusText">Aguardando imagem...</div>
  </aside>

  <main class="preview-area">
    <canvas id="previewCanvas"></canvas>
  </main>
</div>

<script>
const OUT_W = 3307, OUT_H = 4930;
const BLACK_LUMA_CUTOFF = 42;
const BLACK_CHANNEL_CUTOFF = 54;
const WHITE_LUMA_CUTOFF = 226;
const WHITE_SAT_CUTOFF = 44;
let sourceImage = null;
let outputBlob = null;

const $ = id => document.getElementById(id);
const previewCanvas = $('previewCanvas');
const pctx = previewCanvas.getContext('2d');

['lpi','angle','aura','contrast'].forEach(id => {
  const el = $(id);
  el.addEventListener('input', () => {
    const suffix = id === 'lpi' ? ' LPI' : id === 'angle' ? '°' : id === 'aura' ? ' px' : '%';
    $(id+'Val').textContent = el.value + suffix;
  });
});

$('imageInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    sourceImage = img;
    $('processBtn').disabled = false;
    $('downloadBtn').disabled = true;
    outputBlob = null;
    $('statusText').textContent = `Imagem carregada: ${img.width}×${img.height}`;
    drawPreviewSource(img);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
});

function drawPreviewSource(img){
  const ratio = OUT_W / OUT_H;
  const maxW = 600, maxH = 600 / ratio;
  previewCanvas.width = maxW;
  previewCanvas.height = maxH;
  pctx.clearRect(0,0,maxW,maxH);
  const ir = img.width / img.height;
  let dw = maxW, dh = maxW / ir;
  if (dh < maxH) { dh = maxH; dw = maxH * ir; }
  pctx.drawImage(img, (maxW-dw)/2, (maxH-dh)/2, dw, dh);
}

function setProgress(p, msg){
  $('progressFill').style.width = Math.round(p*100)+'%';
  if (msg) $('statusText').textContent = msg;
}

function lumaAt(data, i){
  return 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
}

function saturationAt(data, i){
  const r = data[i], g = data[i+1], b = data[i+2];
  return Math.max(r,g,b) - Math.min(r,g,b);
}

function isBlackPixel(data, i){
  const r = data[i], g = data[i+1], b = data[i+2];
  const l = 0.299*r + 0.587*g + 0.114*b;
  const neutralDark = l <= BLACK_LUMA_CUTOFF && (Math.max(r,g,b) - Math.min(r,g,b)) <= 28;
  const deepBlack = r <= BLACK_CHANNEL_CUTOFF && g <= BLACK_CHANNEL_CUTOFF && b <= BLACK_CHANNEL_CUTOFF;
  return neutralDark || deepBlack;
}

function isProtectedWhite(data, i){
  if (data[i+3] < 30) return false;
  const r = data[i], g = data[i+1], b = data[i+2];
  const l = 0.299*r + 0.587*g + 0.114*b;
  const sat = Math.max(r,g,b) - Math.min(r,g,b);
  return l >= WHITE_LUMA_CUTOFF && sat <= WHITE_SAT_CUTOFF;
}

function dotRadiusForLuma(luma, cell, coverage){
  const maxR = cell * 0.47;
  const minR = Math.max(1.55, cell * 0.18);
  const density = 1 - (luma / 255);
  const tonal = Math.pow(Math.max(0, density), 0.78);
  const coverBoost = 0.82 + Math.min(1, coverage) * 0.18;
  return (minR + tonal * (maxR - minR)) * coverBoost;
}

function triggerDownload(blob = outputBlob){
  if (!blob) return false;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dtflex-round-clean-rgb-${Date.now()}.png`;
  a.style.display = 'none';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}

$('processBtn').addEventListener('click', async () => {
  if (!sourceImage) return;
  $('processBtn').disabled = true;
  $('downloadBtn').disabled = true;
  outputBlob = null;

  setProgress(0.04, 'Preparando canvas 3307×4930...');
  await nextFrame();

  const src = document.createElement('canvas');
  src.width = OUT_W; src.height = OUT_H;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  const ir = sourceImage.width / sourceImage.height;
  const or = OUT_W / OUT_H;
  let dw, dh, dx, dy;
  if (ir > or) { dh = OUT_H; dw = OUT_H * ir; dx = (OUT_W-dw)/2; dy = 0; }
  else { dw = OUT_W; dh = OUT_W / ir; dx = 0; dy = (OUT_H-dh)/2; }
  sctx.drawImage(sourceImage, dx, dy, dw, dh);

  setProgress(0.14, 'Corrigindo contraste RGB sem inverter cores...');
  await nextFrame();

  const imgData = sctx.getImageData(0,0,OUT_W,OUT_H);
  const data = imgData.data;
  const cBoost = parseInt($('contrast').value, 10)/100;
  const f = 1 + cBoost;
  for (let i=0;i<data.length;i+=4){
    data[i]   = clamp((data[i]  -128)*f + 128);
    data[i+1] = clamp((data[i+1]-128)*f + 128);
    data[i+2] = clamp((data[i+2]-128)*f + 128);
  }

  setProgress(0.26, 'Separando preto transparente e branco sólido...');
  await nextFrame();

  const mask = new Uint8Array(OUT_W * OUT_H);
  const whiteMask = new Uint8Array(OUT_W * OUT_H);
  let alphaCount = 0;
  for (let i=3; i<data.length; i+=4) if (data[i] < 250) alphaCount++;
  const useAlpha = alphaCount > 5000;

  for (let i=0,p=0; p<mask.length; i+=4, p++){
    if (useAlpha && data[i+3] <= 30) {
      data[i+3] = 0;
      continue;
    }
    if (isBlackPixel(data, i)) {
      data[i+3] = 0;
      continue;
    }
    mask[p] = 1;
    if (isProtectedWhite(data, i)) whiteMask[p] = 1;
  }

  setProgress(0.42, 'Calculando área da aura...');
  await nextFrame();

  const auraPx = parseInt($('aura').value, 10);
  const dist = computeDistanceOutside(mask, OUT_W, OUT_H);

  setProgress(0.58, 'Renderizando ROUND CLEAN em alta definição...');
  await nextFrame();

  const out = document.createElement('canvas');
  out.width = OUT_W; out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.clearRect(0,0,OUT_W,OUT_H);

  const lpi = parseInt($('lpi').value, 10);
  const dpi = 300;
  const cell = Math.max(7, Math.round(dpi / lpi));
  const angle = parseInt($('angle').value, 10);

  await renderRoundCleanRGB(octx, data, mask, whiteMask, dist, OUT_W, OUT_H, cell, angle, auraPx);
  restoreProtectedWhites(octx, data, whiteMask, OUT_W, OUT_H);

  setProgress(0.96, 'Gerando PNG transparente...');
  await nextFrame();

  out.toBlob(blob => {
    if (!blob) {
      setProgress(1, 'Erro ao gerar PNG. Tente com outra imagem.');
      $('processBtn').disabled = false;
      return;
    }
    outputBlob = blob;
    $('downloadBtn').disabled = false;
    $('processBtn').disabled = false;

    const ratio = OUT_W / OUT_H;
    const maxW = 600, maxH = 600/ratio;
    previewCanvas.width = maxW;
    previewCanvas.height = maxH;
    pctx.clearRect(0,0,maxW,maxH);
    pctx.drawImage(out, 0, 0, maxW, maxH);

    const started = triggerDownload(blob);
    setProgress(1, started ? '✅ Pronto! Download automático iniciado.' : '✅ Pronto! Clique em Baixar Novamente.');
  }, 'image/png');
});

function clamp(v){
  return Math.max(0, Math.min(255, Math.round(v)));
}

function nextFrame(){
  return new Promise(resolve => requestAnimationFrame(resolve));
}

function computeDistanceOutside(mask, W, H){
  const INF = 1e9;
  const d = new Float32Array(W*H);
  for (let i=0;i<d.length;i++) d[i] = mask[i] ? 0 : INF;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const i = y*W+x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x>0) v = Math.min(v, d[i-1]+1);
      if (y>0) v = Math.min(v, d[i-W]+1);
      if (x>0 && y>0) v = Math.min(v, d[i-W-1]+1.414);
      if (x<W-1 && y>0) v = Math.min(v, d[i-W+1]+1.414);
      d[i] = v;
    }
  }
  for (let y=H-1; y>=0; y--){
    for (let x=W-1; x>=0; x--){
      const i = y*W+x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x<W-1) v = Math.min(v, d[i+1]+1);
      if (y<H-1) v = Math.min(v, d[i+W]+1);
      if (x<W-1 && y<H-1) v = Math.min(v, d[i+W+1]+1.414);
      if (x>0 && y<H-1) v = Math.min(v, d[i+W-1]+1.414);
      d[i] = v;
    }
  }
  return d;
}

function sampleCellColor(data, mask, whiteMask, W, H, cx, cy, cell){
  const half = Math.max(2, Math.floor(cell * 0.46));
  const step = Math.max(1, Math.floor(cell / 4));
  let r=0, g=0, b=0, count=0, covered=0;
  for (let y=cy-half; y<=cy+half; y+=step){
    if (y<0 || y>=H) continue;
    for (let x=cx-half; x<=cx+half; x+=step){
      if (x<0 || x>=W) continue;
      const p = y*W + x;
      if (!mask[p]) continue;
      covered++;
      if (whiteMask[p]) continue;
      const i = p*4;
      if (data[i+3] <= 30 || isBlackPixel(data, i)) continue;
      r += data[i]; g += data[i+1]; b += data[i+2];
      count++;
    }
  }
  if (count === 0) return null;
  const inv = 1 / count;
  const coverage = covered / Math.max(1, Math.pow(Math.floor((half*2)/step)+1, 2));
  return {
    r: r * inv,
    g: g * inv,
    b: b * inv,
    l: 0.299*(r*inv) + 0.587*(g*inv) + 0.114*(b*inv),
    coverage
  };
}

async function renderRoundCleanRGB(ctx, data, mask, whiteMask, dist, W, H, cell, angleDeg, auraPx){
  const rad = angleDeg * Math.PI / 180;
  const cosA = Math.cos(rad), sinA = Math.sin(rad);
  const diag = Math.ceil(Math.sqrt(W*W + H*H));
  const half = diag / 2;
  const cx = W/2, cy = H/2;
  ctx.globalCompositeOperation = 'source-over';

  for (let gy = -half; gy <= half; gy += cell){
    for (let gx = -half; gx <= half; gx += cell){
      const ix = Math.round(cx + gx*cosA - gy*sinA);
      const iy = Math.round(cy + gx*sinA + gy*cosA);
      if (ix<0 || iy<0 || ix>=W || iy>=H) continue;

      const p = iy*W + ix;
      const inside = mask[p] === 1;
      const distOut = dist[p];
      if (!inside && distOut > auraPx) continue;
      if (whiteMask[p]) continue;

      const avg = sampleCellColor(data, mask, whiteMask, W, H, ix, iy, cell);
      if (!avg) continue;

      let radius = dotRadiusForLuma(avg.l, cell, avg.coverage);
      let alpha = 1;
      if (!inside){
        const fade = auraPx > 0 ? 1 - (distOut / auraPx) : 0;
        radius *= fade;
        alpha = fade;
      }
      if (radius < 0.8 || alpha < 0.05) continue;

      ctx.fillStyle = `rgba(${avg.r|0},${avg.g|0},${avg.b|0},${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(ix, iy, radius, 0, Math.PI*2);
      ctx.fill();
    }
    if (Math.round((gy + half) / cell) % 28 === 0) {
      const prog = 0.58 + 0.34 * ((gy+half)/diag);
      setProgress(prog, 'Renderizando retícula normal RGB...');
      await new Promise(r => setTimeout(r, 0));
    }
  }
}

function restoreProtectedWhites(ctx, data, whiteMask, W, H){
  const whiteCanvas = document.createElement('canvas');
  whiteCanvas.width = W;
  whiteCanvas.height = H;
  const wctx = whiteCanvas.getContext('2d');
  const whiteData = wctx.createImageData(W, H);
  const out = whiteData.data;
  for (let p=0, i=0; p<whiteMask.length; p++, i+=4){
    if (!whiteMask[p]) continue;
    out[i] = data[i];
    out[i+1] = data[i+1];
    out[i+2] = data[i+2];
    out[i+3] = data[i+3];
  }
  wctx.putImageData(whiteData, 0, 0);
  ctx.drawImage(whiteCanvas, 0, 0);
}

$('downloadBtn').addEventListener('click', () => {
  triggerDownload();
});
</script>
</body>
</html>
